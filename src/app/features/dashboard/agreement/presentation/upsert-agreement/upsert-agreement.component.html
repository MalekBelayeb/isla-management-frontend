<div class="card">
  <div class="card-header">
    <h3 *ngIf="agreementDetails" class="mb-0">Modifier contrat</h3>
    <h3 *ngIf="!agreementDetails" class="mb-0">Nouveau contrat</h3>
  </div>

  <div class="card-body">
    <form [formGroup]="formGroup" (ngSubmit)="upsertAgreement()">
      <div class="row mb-4">
        <label
          class="col-md-2 col-form-label form-control-label"
          for="example-datetime-local-input"
        >
          Date d'effet <span class="text-danger">*</span>
        </label>

        <div class="col-md-10">
          <app-date-range-picker
            [startDateValue]="upsertAgreementForm['startDate'].value"
            (startDate)="onStartDateChange($event)"
            [startDateInvalid]="
              submitted && upsertAgreementForm['startDate'].errors?.['required']
            "
            [startDateErrorMessage]="
              'Champs incorrect, Date de début est obligatoire'
            "
            [useSingleInputDate]="true"
            [isTodayMinDate]="false"
          ></app-date-range-picker>
        </div>
      </div>

      <div class="form-group row">
        <label class="col-md-2 col-form-label form-control-label">
          Montant Du Loyer (TND) <span class="text-danger">*</span>
        </label>

        <div class="col-md-10">
          <div class="input-group input-group-merge">
            <input
              formControlName="rentAmount"
              class="form-control"
              id="example-text-input"
              placeholder=""
              type="number"
              [ngClass]="{
                focused: focus2 === true,
                'is-invalid':
                  submitted &&
                  upsertAgreementForm['rentAmount'].errors?.['required'],
              }"
              (focus)="focus2 = true"
              (blur)="focus2 = false"
            />
          </div>
          <div
            *ngIf="
              submitted &&
              upsertAgreementForm['rentAmount'].errors?.['required']
            "
            class="error-text"
          >
            Champs incorrect, Montant Du Loyer est obligatoire.
          </div>
        </div>
      </div>
      <div class="form-group row">
        <label
          class="col-md-2 col-form-label form-control-label"
          for="example-time-input"
        >
          Fréquence De Paiement <span class="text-danger">*</span>
        </label>
        <div class="col-md-10">
          <app-search-input
            [clearInput]="false"
            [searchInputValue]="paymentFrequencySearchValue"
            [prefixIcon]="'fas fa-search'"
            [searchPlaceholder]="'Fréquence De Paiement'"
            [searchLabel]="'Résultats'"
            [maxSize]="3"
            [isInvalid]="
              submitted &&
              upsertAgreementForm['paymentFrequency'].errors?.['required']
            "
            [errorMessage]="
              'Champs incorrect, Fréquence De Paiement est obligatoire'
            "
            (selectedResultItem)="selectedPaymentFrequency($event)"
            [searchResult]="frequencyPaymentsTypeList"
            [isEditable]="false"
          ></app-search-input>
        </div>
      </div>
      <div class="row mb-4">
        <label
          class="col-md-2 col-form-label form-control-label"
          for="example-time-input"
        >
          Local <span class="text-danger">*</span>
        </label>
        <div class="col-md-10">
          <app-apartment-searchable-modal
            [selectedValue]="searchApartmentValue"
            (apartmentClicked)="onSelectedApartmentSearchItem($event)"
          />
        </div>
      </div>
      <div class="row mb-4">
        <label
          class="col-md-2 col-form-label form-control-label"
          for="example-time-input"
        >
          Locataire <span class="text-danger">*</span>
        </label>
        <div class="col-md-10">
          <app-tenant-searchable-modal
            [selectedValue]="searchTenantValue"
            (tenantClicked)="onSelectedTenantSearchItem($event)"
          />
        </div>
      </div>

      <div class="form-group row mt-4">
        <label
          class="col-md-2 col-form-label form-control-label"
          for="example-text-input"
        >
          Notes
        </label>

        <div class="col-md-10">
          <div class="input-group input-group-merge">
            <textarea
              formControlName="notes"
              class="form-control"
              id="example-text-input"
              type="text"
              value=""
              rows="4"
              placeholder="Description"
              (focus)="focus7 = true"
              (blur)="focus7 = false"
            ></textarea>
          </div>
        </div>
      </div>
      <hr />

      <div class="mt-5 d-flex w-100 flex-row justify-content-end">
        <button *ngIf="!isLoading" class="btn btn-primary" type="submit">
          Confirmer
        </button>
        <div
          *ngIf="isLoading"
          class="spinner-border text-primary mr-5"
          role="status"
        ></div>
      </div>
    </form>
  </div>
</div>
